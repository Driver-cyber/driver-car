<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1c1a17" />
<title>Driver — Car Buying Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* earthy palette — rust, gold, bone, ink */
    --ink: #1c1a17;
    --ink-soft: #3a352f;
    --bone: #f4eee3;
    --bone-2: #ebe2d2;
    --card: #fffaf1;
    --rust: #a6432c;
    --rust-deep: #82331f;
    --gold: #c98a2b;
    --gold-soft: #e6c277;
    --sage: #5e6f4f;
    --line: #ddd2bd;
    --muted: #8a8175;
    --good: #4f7a4a;
    --warn: #b5852a;
    --bad: #a6432c;
    --shadow: 0 1px 2px rgba(28,26,23,.06), 0 8px 24px rgba(28,26,23,.08);
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bone);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }

  h1, h2, h3, .serif { font-family: "Fraunces", Georgia, serif; }

  a { color: var(--rust); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---------- Header ---------- */
  header.app {
    padding: 28px 0 8px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  header.app h1 {
    font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.04;
    margin: 0; letter-spacing: -.01em;
  }
  header.app .sub {
    margin: 8px 0 0; color: var(--ink-soft); font-size: 13px;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; gap: 8px; margin: 22px 0 4px; flex-wrap: wrap;
  }
  .tab {
    font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--ink-soft);
    border: 1.5px solid var(--line);
    transition: all .15s ease;
  }
  .tab:hover { border-color: var(--gold); }
  .tab.active {
    background: var(--ink); color: var(--bone); border-color: var(--ink);
  }
  .tab.ghost { opacity: .55; font-style: italic; }
  .tab.ghost::after { content: " +"; }

  /* ---------- Budget banner ---------- */
  .budget {
    margin: 18px 0; padding: 16px 18px; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--ink) 0%, #2a2620 100%);
    color: var(--bone); box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: baseline;
  }
  .budget .b-item { display: flex; flex-direction: column; gap: 2px; }
  .budget .b-label {
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft);
  }
  .budget .b-val { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; }
  .budget .b-note { flex-basis: 100%; font-size: 12px; color: #d9cdb8; line-height: 1.45; margin-top: 2px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin: 16px 0 10px;
  }
  .toolbar .grow { flex: 1 1 auto; }
  select, input[type="text"], input[type="number"], textarea {
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink);
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  label.field span { text-transform: uppercase; letter-spacing: .14em; font-size: 10px; }

  .btn {
    font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500;
    padding: 9px 14px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); transition: all .15s ease; white-space: nowrap;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--rust); color: #fff; border-color: var(--rust); }
  .btn.primary:hover { background: var(--rust-deep); border-color: var(--rust-deep); }
  .btn.tiny { padding: 5px 9px; font-size: 11px; }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { background: var(--bad); color: #fff; border-color: var(--bad); }

  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
  .filterbar select { font-size: 12px; padding: 6px 8px; }
  .chk-only {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft);
    padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer;
  }
  .chk-only input { accent-color: var(--rust); }

  /* ---------- Listing cards ---------- */
  .count { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 16px 16px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
    position: relative;
  }
  .card.fav { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), var(--shadow); }
  .card.over { }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-head h3 {
    margin: 0; font-style: italic; font-weight: 600; font-size: 21px; line-height: 1.12; flex: 1;
  }
  .star {
    background: none; border: none; cursor: pointer; font-size: 22px; line-height: 1;
    color: var(--line); padding: 0 2px; transition: transform .1s ease;
  }
  .star.on { color: var(--gold); }
  .star:active { transform: scale(1.25); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 2px; font-size: 12.5px; color: var(--ink-soft); }
  .meta b { color: var(--ink); font-weight: 500; }

  .price-row { display: flex; align-items: baseline; gap: 10px; margin: 10px 0 6px; flex-wrap: wrap; }
  .price { font-family: "Fraunces", serif; font-size: 26px; font-weight: 600; cursor: pointer; border-bottom: 1.5px dashed transparent; }
  .price:hover { border-bottom-color: var(--gold); }
  .price.none { color: var(--muted); font-style: italic; font-size: 18px; cursor: pointer; }
  .price.none:hover { color: var(--rust); }
  .price-edit { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .price-prefix { font-family: "Fraunces", serif; font-size: 20px; color: var(--ink-soft); }
  .price-input { width: 92px; font-size: 15px; padding: 6px 8px; }
  .price-conf { font-size: 12px; padding: 6px 8px; }
  .badge {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px;
    border-radius: 999px; font-weight: 700;
  }
  .badge.confirmed { background: #e3efe0; color: var(--good); }
  .badge.estimate { background: #f6ecd5; color: var(--warn); }
  .badge.unknown { background: #efe7d8; color: var(--muted); }
  .badge.over { background: #f3ddd5; color: var(--bad); }
  .badge.under { background: #e3efe0; color: var(--good); }

  .status { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0; padding-left: 10px; border-left: 2.5px solid var(--gold-soft); }
  .notes { font-size: 12px; color: var(--muted); margin: 4px 0; }

  .card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .card-actions .spacer { flex: 1; }

  /* disclosure: checklist + edit */
  details.disc { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.disc > summary {
    cursor: pointer; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    list-style: none; display: flex; align-items: center; gap: 6px; user-select: none;
  }
  details.disc > summary::-webkit-details-marker { display: none; }
  details.disc > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
  details.disc[open] > summary::before { transform: rotate(90deg); }
  .progress { margin-left: auto; font-size: 10px; color: var(--gold); letter-spacing: .08em; }

  .checklist { list-style: none; padding: 0; margin: 10px 0 2px; }
  .checklist li { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; font-size: 12.5px; line-height: 1.4; }
  .checklist input { margin-top: 2px; accent-color: var(--rust); width: 16px; height: 16px; flex-shrink: 0; }
  .checklist li.done label { color: var(--muted); text-decoration: line-through; }

  /* edit form */
  .editform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .editform label.field.full { grid-column: 1 / -1; }
  .editform textarea { resize: vertical; min-height: 44px; }

  /* ---------- Reference sections ---------- */
  section.ref { margin: 26px 0; }
  section.ref > details { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  section.ref > details > summary {
    cursor: pointer; padding: 14px 18px; list-style: none; display: flex; align-items: center; gap: 10px;
    font-family: "Fraunces", serif; font-style: italic; font-size: 19px; font-weight: 600;
  }
  section.ref > details > summary::-webkit-details-marker { display: none; }
  section.ref > details > summary::before { content: "▸"; font-family: "JetBrains Mono", monospace; font-style: normal; font-size: 12px; color: var(--gold); transition: transform .15s; }
  section.ref > details[open] > summary::before { transform: rotate(90deg); }
  .ref-body { padding: 0 18px 18px; }

  .trim { padding: 12px 0; border-top: 1px solid var(--line); }
  .trim:first-child { border-top: none; }
  .trim-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .trim-name { font-family: "Fraunces", serif; font-weight: 600; font-size: 17px; }
  .trim-tier { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .trim-seats { margin-left: auto; font-size: 12px; }
  .seat-warn { color: var(--bad); font-weight: 700; }
  .seat-ok { color: var(--good); font-weight: 700; }
  .trim-detail { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; }
  .trim-detail .k { color: var(--muted); }
  .warnbox { margin-top: 8px; padding: 9px 12px; background: #f3ddd5; border-radius: 10px; font-size: 12px; color: var(--rust-deep); }
  .fitpill { font-size: 10px; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .08em; }
  .fit-realistic { background: #e3efe0; color: var(--good); }
  .fit-borderline { background: #f6ecd5; color: var(--warn); }
  .fit-stretch, .fit-over { background: #f3ddd5; color: var(--bad); }

  .issue { padding: 9px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .issue:first-child { border-top: none; }
  .issue b { font-family: "Fraunces", serif; font-style: italic; }

  .hubs { display: flex; flex-wrap: wrap; gap: 8px; }
  .hub {
    font-size: 12px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
  }
  .hub:hover { border-color: var(--gold); text-decoration: none; }
  .hub::after { content: "↗"; color: var(--gold); font-size: 11px; }

  /* ---------- Footer / data ---------- */
  footer.app { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  footer.app .data-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-style: italic; font-family: "Fraunces", serif; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bone); padding: 11px 18px; border-radius: 999px;
    font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 50; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* placeholder tab panel */
  .placeholder { text-align: center; padding: 48px 20px; }
  .placeholder h2 { font-style: italic; font-size: 26px; margin: 0 0 8px; }
  .placeholder p { color: var(--muted); font-size: 13px; max-width: 380px; margin: 6px auto; }

  @media (max-width: 520px) {
    header.app h1 { font-size: 32px; }
    .editform { grid-template-columns: 1fr; }
    .budget { gap: 12px 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <p class="eyebrow">Vancouver, WA · Chad &amp; Joelle</p>
    <h1 id="appTitle">The Car Hunt</h1>
    <p class="sub" id="appSub">A calm place to track listings, run the checklist, and hold the line on budget.</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main"></main>

  <footer class="app">
    <div class="data-actions">
      <button class="btn tiny" id="exportBtn">⤓ Export JSON</button>
      <button class="btn tiny" id="importBtn">⤒ Import JSON</button>
      <button class="btn tiny danger" id="resetBtn">↺ Reset to seed</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
    <p id="footNote">State lives in this browser (localStorage). Export to back up or hand off to the other phone.</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

/* Registry of vehicle categories. Add an entry → it gets a tab + full UI.
   Each points at a committed seed file (loaded on GitHub Pages) with an
   inline embedded fallback for file://. */
const CATEGORY_SEEDS = [
  { key: "telluride", file: "seed-data.json",   embedded: EMBEDDED_SEED,
    meta: { label: "Tellurides", make: "Kia", model: "Telluride" } },
  { key: "minivan",   file: "seed-minivan.json", embedded: EMBEDDED_MINIVAN,
    meta: { label: "Minivans", make: "Various", model: "Minivan" } }
];

let state = null;
let ui = { sort: "default", filterTrim: "all", filterDrive: "all", favOnly: false };

/* ---------------- Store module (swap target for Phase 2 backend) ---------- */
const store = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.warn("load failed", e); }
    return null;
  },
  save(s) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
    catch (e) { console.warn("save failed", e); }
  },
  clear() { localStorage.removeItem(STORAGE_KEY); }
};

/* ---------------- Bootstrapping ------------------------------------------- */
/* Load one category's raw seed doc: try the committed file, fall back to the
   inline embedded copy (file:// / offline). */
async function fetchSeed(entry) {
  try {
    const res = await fetch(entry.file, { cache: "no-store" });
    if (res.ok) return await res.json();
  } catch (e) { /* file:// or offline — use embedded */ }
  return entry.embedded;
}

/* Wrap a raw seed doc into a category record. Per-category identity comes from
   the seed's own `meta` block when present, else the registry default. */
function categoryFromSeed(seed, meta = {}) {
  const m = seed.meta || {};
  return {
    label: m.label || meta.label || "Listings",
    make: m.make || meta.make || "",
    model: m.model || meta.model || "",
    primerLabel: m.primerLabel || meta.primerLabel || "Trim primer",
    budget: seed.budget,
    financing: seed.financing,
    trimPrimer: seed.trimPrimer || [],
    checklistTemplate: seed.checklistTemplate || [],
    knownIssues: seed.knownIssues || {},
    listings: seed.listings || [],
    searchHubs: seed.searchHubs || []
  };
}

/* Build the full default category set from every registered seed. */
async function buildDefaultCategories() {
  const cats = {};
  for (const entry of CATEGORY_SEEDS) {
    const seed = await fetchSeed(entry);
    cats[entry.key] = categoryFromSeed(seed, entry.meta);
  }
  return cats;
}

async function freshState() {
  return {
    schemaVersion: 1,
    activeCategory: CATEGORY_SEEDS[0].key,
    lastUpdated: new Date().toISOString().slice(0, 10),
    categories: await buildDefaultCategories()
  };
}

async function init() {
  const saved = store.load();
  if (saved && saved.categories) {
    state = saved;
    // Migration: backfill any newly-added categories (e.g. minivans) without
    // clobbering the user's existing edits in categories they already have.
    const defaults = await buildDefaultCategories();
    let added = false;
    for (const [key, cat] of Object.entries(defaults)) {
      if (!state.categories[key]) { state.categories[key] = cat; added = true; }
    }
    if (added) store.save(state);
  } else {
    state = await freshState();
    store.save(state);
  }
  if (!state.activeCategory || !state.categories[state.activeCategory]) {
    state.activeCategory = Object.keys(state.categories)[0];
  }
  render();
}

/* ---------------- Helpers ------------------------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMoney = (n) => (n == null ? null : "$" + Number(n).toLocaleString("en-US"));
const fmtMiles = (n) => (n == null ? "—" : Number(n).toLocaleString("en-US") + " mi");
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

function persist() { state.lastUpdated = new Date().toISOString().slice(0, 10); store.save(state); }
function activeCat() { return state.categories[state.activeCategory]; }

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------------- Render: tabs + shell ------------------------------------ */
function render() {
  renderTabs();
  const main = $("#main");
  main.innerHTML = "";
  const cat = activeCat();
  if (!cat) { main.appendChild(el("div", { class: "empty" }, "No category selected.")); return; }

  main.appendChild(budgetBanner(cat));
  main.appendChild(toolbar(cat));
  main.appendChild(filterBar(cat));
  main.appendChild(listingsView(cat));
  main.appendChild(trimPrimerSection(cat));
  main.appendChild(knownIssuesSection(cat));
  main.appendChild(searchHubsSection(cat));
}

function renderTabs() {
  const nav = $("#tabs");
  nav.innerHTML = "";
  for (const [key, cat] of Object.entries(state.categories)) {
    nav.appendChild(el("button", {
      class: "tab" + (key === state.activeCategory ? " active" : ""),
      onclick: () => { state.activeCategory = key; persist(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    }, cat.label || key));
  }
}

/* ---------------- Budget banner ------------------------------------------- */
function budgetBanner(cat) {
  const b = cat.budget || {};
  const fin = cat.financing || {};
  const items = [];
  if (b.preTaxTarget != null) items.push(["Pre-tax target", fmtMoney(b.preTaxTarget)]);
  if (b.allInTarget != null) items.push(["All-in (tax+fees)", fmtMoney(b.allInTarget)]);
  if (b.monthlyPaymentTarget != null) items.push(["Monthly", fmtMoney(b.monthlyPaymentTarget) + "/mo"]);
  if (fin.rate != null) items.push(["Pre-approved rate", (fin.rate * 100).toFixed(2) + "%"]);

  return el("div", { class: "budget" },
    ...items.map(([label, val]) => el("div", { class: "b-item" },
      el("span", { class: "b-label" }, label),
      el("span", { class: "b-val" }, val)
    )),
    b.notes ? el("div", { class: "b-note" }, b.notes) : null
  );
}

/* ---------------- Toolbar (sort + add) ------------------------------------ */
function toolbar(cat) {
  const sortSel = el("select", { onchange: e => { ui.sort = e.target.value; render(); } },
    ...[
      ["default", "Sort: Default"],
      ["price-asc", "Price ↑"],
      ["price-desc", "Price ↓"],
      ["mileage-asc", "Mileage ↑"],
      ["mileage-desc", "Mileage ↓"],
      ["year-desc", "Year (newest)"],
      ["year-asc", "Year (oldest)"],
      ["value", "Best value"]
    ].map(([v, l]) => el("option", { value: v, selected: ui.sort === v }, l))
  );

  return el("div", { class: "toolbar" },
    sortSel,
    el("span", { class: "grow" }),
    el("button", { class: "btn primary", onclick: () => addListing(cat) }, "+ Add listing")
  );
}

/* ---------------- Filter bar ---------------------------------------------- */
function filterBar(cat) {
  const trims = [...new Set(cat.listings.map(l => l.trim).filter(Boolean))].sort();
  const drives = [...new Set(cat.listings.map(l => l.drivetrain).filter(Boolean))].sort();

  const trimSel = el("select", { onchange: e => { ui.filterTrim = e.target.value; render(); } },
    el("option", { value: "all", selected: ui.filterTrim === "all" }, "All trims"),
    ...trims.map(t => el("option", { value: t, selected: ui.filterTrim === t }, t))
  );
  const driveSel = el("select", { onchange: e => { ui.filterDrive = e.target.value; render(); } },
    el("option", { value: "all", selected: ui.filterDrive === "all" }, "All drivetrains"),
    ...drives.map(d => el("option", { value: d, selected: ui.filterDrive === d }, d))
  );
  const favLabel = el("label", { class: "chk-only" },
    el("input", { type: "checkbox", checked: ui.favOnly, onchange: e => { ui.favOnly = e.target.checked; render(); } }),
    "★ Favorites only"
  );

  return el("div", { class: "filterbar" }, trimSel, driveSel, favLabel);
}

/* ---------------- Listings view ------------------------------------------- */
function applySortFilter(listings) {
  let out = listings.slice();
  if (ui.filterTrim !== "all") out = out.filter(l => l.trim === ui.filterTrim);
  if (ui.filterDrive !== "all") out = out.filter(l => l.drivetrain === ui.filterDrive);
  if (ui.favOnly) out = out.filter(l => l.favorite);

  const num = (v, d) => (v == null ? d : v);
  switch (ui.sort) {
    case "price-asc": out.sort((a, b) => num(a.price, Infinity) - num(b.price, Infinity)); break;
    case "price-desc": out.sort((a, b) => num(b.price, -Infinity) - num(a.price, -Infinity)); break;
    case "mileage-asc": out.sort((a, b) => num(a.mileage, Infinity) - num(b.mileage, Infinity)); break;
    case "mileage-desc": out.sort((a, b) => num(b.mileage, -Infinity) - num(a.mileage, -Infinity)); break;
    case "year-desc": out.sort((a, b) => num(b.year, -Infinity) - num(a.year, -Infinity)); break;
    case "year-asc": out.sort((a, b) => num(a.year, Infinity) - num(b.year, Infinity)); break;
    case "value": out.sort((a, b) => valueScore(a) - valueScore(b)); break;
    default:
      // favorites first, then by price asc (nulls last)
      out.sort((a, b) => (b.favorite - a.favorite) || (num(a.price, Infinity) - num(b.price, Infinity)));
  }
  return out;
}

// Lower is better: distance over pre-tax budget + a mild mileage penalty.
function valueScore(l) {
  const cat = activeCat();
  const target = (cat.budget && cat.budget.preTaxTarget) || 22500;
  const price = l.price == null ? target * 1.15 : l.price; // unknown ≈ slightly over
  const overBudget = Math.max(0, price - target) / target;
  const milePenalty = (l.mileage == null ? 80000 : l.mileage) / 1000000;
  return overBudget + milePenalty;
}

function listingsView(cat) {
  const list = applySortFilter(cat.listings);
  const frag = document.createDocumentFragment();
  frag.appendChild(el("p", { class: "count" },
    `${list.length} of ${cat.listings.length} ${cat.listings.length === 1 ? "listing" : "listings"}`));

  if (!list.length) {
    frag.appendChild(el("div", { class: "empty" }, "No listings match these filters."));
    return frag;
  }
  for (const l of list) frag.appendChild(listingCard(cat, l));
  return frag;
}

function priceBadge(l, cat) {
  const conf = l.priceConfidence || "unknown";
  const badges = [el("span", { class: "badge " + conf }, conf)];
  const target = cat.budget && cat.budget.preTaxTarget;
  if (l.price != null && target != null) {
    if (l.price > target) badges.push(el("span", { class: "badge over" }, "over target"));
    else badges.push(el("span", { class: "badge under" }, "within target"));
  }
  return badges;
}

/* The price row swaps between a display state and an inline editor — so you can
   tap the price (or "Add price"), type what you found at the source, and save
   without opening the full edit form. */
function priceRowEl(cat, l) {
  const row = el("div", { class: "price-row" });
  renderPriceDisplay(row, cat, l);
  return row;
}

function renderPriceDisplay(row, cat, l) {
  row.innerHTML = "";
  const open = () => renderPriceEditor(row, cat, l);
  if (l.price != null) row.appendChild(el("span", { class: "price", title: "Tap to edit", onclick: open }, fmtMoney(l.price)));
  else row.appendChild(el("span", { class: "price none", title: "Tap to add", onclick: open }, "Price: find at source"));
  priceBadge(l, cat).forEach(b => row.appendChild(b));
}

function renderPriceEditor(row, cat, l) {
  row.innerHTML = "";
  // Looked at the source and entering a real number? Default to "confirmed".
  const defConf = (l.price == null && (l.priceConfidence || "unknown") === "unknown")
    ? "confirmed" : (l.priceConfidence || "unknown");
  const input = el("input", { type: "number", inputmode: "numeric", min: "0", step: "1",
    placeholder: "e.g. 22500", value: l.price ?? "", class: "price-input" });
  const conf = el("select", { class: "price-conf", title: "Price confidence" },
    ...["confirmed", "estimate", "unknown"].map(o => el("option", { value: o, selected: defConf === o }, o)));
  const save = () => {
    const v = String(input.value).trim();
    l.price = v === "" ? null : Number(v);
    l.priceConfidence = l.price == null ? "unknown" : conf.value;
    persist();
    render();
    toast(l.price == null ? "Price cleared" : "Price saved — " + fmtMoney(l.price));
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    if (e.key === "Escape") renderPriceDisplay(row, cat, l);
  });
  row.appendChild(el("span", { class: "price-edit" },
    el("span", { class: "price-prefix" }, "$"),
    input, conf,
    el("button", { class: "btn tiny primary", onclick: save }, "Save"),
    el("button", { class: "btn tiny", onclick: () => renderPriceDisplay(row, cat, l) }, "Cancel")
  ));
  setTimeout(() => { input.focus(); input.select(); }, 0);
}

function listingCard(cat, l) {
  const over = l.price != null && cat.budget && cat.budget.preTaxTarget != null && l.price > cat.budget.preTaxTarget;
  const card = el("div", { class: "card" + (l.favorite ? " fav" : "") + (over ? " over" : "") });

  // head
  const star = el("button", {
    class: "star" + (l.favorite ? " on" : ""), title: "Favorite",
    onclick: () => { l.favorite = !l.favorite; persist(); render(); }
  }, l.favorite ? "★" : "☆");
  card.appendChild(el("div", { class: "card-head" },
    el("h3", {}, l.title || "Untitled listing"),
    star
  ));

  // meta
  const meta = el("div", { class: "meta" });
  if (l.year) meta.appendChild(el("span", {}, el("b", {}, String(l.year))));
  if (l.trim) meta.appendChild(el("span", {}, "Trim ", el("b", {}, l.trim)));
  if (l.drivetrain) meta.appendChild(el("span", {}, el("b", {}, l.drivetrain)));
  meta.appendChild(el("span", {}, el("b", {}, fmtMiles(l.mileage))));
  if (l.dealer) meta.appendChild(el("span", {}, l.dealer));
  if (l.distanceMiles != null) meta.appendChild(el("span", {}, l.distanceMiles + " mi away"));
  card.appendChild(meta);

  // price (with inline quick-edit)
  card.appendChild(priceRowEl(cat, l));

  if (l.status) card.appendChild(el("div", { class: "status" }, l.status));
  if (l.notes) card.appendChild(el("div", { class: "notes" }, "✎ " + l.notes));

  // actions
  const actions = el("div", { class: "card-actions" });
  if (l.sourceLink) actions.appendChild(el("a", { class: "btn tiny", href: l.sourceLink, target: "_blank", rel: "noopener noreferrer" }, "Find at source ↗"));
  actions.appendChild(el("button", { class: "btn tiny", onclick: () => { const r = card.querySelector(".price-row"); if (r) renderPriceEditor(r, cat, l); } }, l.price != null ? "✎ Update price" : "＋ Add price"));
  actions.appendChild(el("span", { class: "spacer" }));
  actions.appendChild(el("button", { class: "btn tiny danger", onclick: () => deleteListing(cat, l) }, "Delete"));
  card.appendChild(actions);

  // checklist disclosure
  card.appendChild(checklistDisc(cat, l));
  // edit disclosure
  card.appendChild(editDisc(cat, l, card));

  return card;
}

/* ---------------- Per-car checklist --------------------------------------- */
function checklistDisc(cat, l) {
  const tmpl = cat.checklistTemplate || [];
  l.checklist = l.checklist || {};
  const doneCount = tmpl.filter(item => l.checklist[item]).length;

  const d = el("details", { class: "disc" });
  d.appendChild(el("summary", {},
    "Test-drive checklist",
    el("span", { class: "progress" }, `${doneCount}/${tmpl.length}`)
  ));
  const ul = el("ul", { class: "checklist" });
  tmpl.forEach((item, i) => {
    const id = `chk-${l.id}-${i}`;
    const checked = !!l.checklist[item];
    const li = el("li", { class: checked ? "done" : "" },
      el("input", {
        type: "checkbox", id, checked,
        onchange: e => {
          l.checklist[item] = e.target.checked;
          persist();
          li.classList.toggle("done", e.target.checked);
          $("span.progress", d).textContent =
            `${tmpl.filter(it => l.checklist[it]).length}/${tmpl.length}`;
        }
      }),
      el("label", { for: id }, item)
    );
    ul.appendChild(li);
  });
  d.appendChild(ul);
  return d;
}

/* ---------------- Edit form ----------------------------------------------- */
function editDisc(cat, l, card) {
  const d = el("details", { class: "disc" });
  d.appendChild(el("summary", {}, "Edit details"));

  const f = (name, label, value, type = "text") =>
    el("label", { class: "field" + (type === "textarea" ? " full" : "") },
      el("span", {}, label),
      type === "textarea"
        ? el("textarea", { "data-k": name }, value ?? "")
        : el("input", { type, "data-k": name, value: value ?? "" })
    );

  const form = el("div", { class: "editform" },
    f("title", "Title", l.title), f("dealer", "Dealer", l.dealer),
    f("year", "Year", l.year, "number"), f("trim", "Trim", l.trim),
    f("drivetrain", "Drivetrain", l.drivetrain), f("mileage", "Mileage", l.mileage, "number"),
    f("price", "Price ($)", l.price, "number"),
    el("label", { class: "field" }, el("span", {}, "Price confidence"),
      el("select", { "data-k": "priceConfidence" },
        ...["unknown", "estimate", "confirmed"].map(o =>
          el("option", { value: o, selected: (l.priceConfidence || "unknown") === o }, o)))),
    f("distanceMiles", "Distance (mi)", l.distanceMiles, "number"),
    f("sourceLink", "Source link", l.sourceLink),
    f("status", "Status", l.status, "textarea"),
    f("notes", "Notes", l.notes, "textarea")
  );
  d.appendChild(form);
  d.appendChild(el("div", { class: "card-actions" },
    el("button", { class: "btn tiny primary", onclick: () => saveEdit(l, form, d) }, "Save changes"),
    el("button", { class: "btn tiny", onclick: () => { d.removeAttribute("open"); } }, "Cancel")
  ));
  return d;
}

function saveEdit(l, form, d) {
  form.querySelectorAll("[data-k]").forEach(inp => {
    const k = inp.getAttribute("data-k");
    let v = inp.value;
    if (["year", "mileage", "price", "distanceMiles"].includes(k)) {
      v = v.trim() === "" ? null : Number(v);
    } else {
      v = v.trim();
      if (v === "" && ["dealer", "trim", "drivetrain", "sourceLink", "status", "notes"].includes(k)) v = (k === "status" || k === "notes" || k === "trim" || k === "drivetrain") ? v : v;
    }
    l[k] = v;
  });
  persist();
  toast("Saved");
  render();
}

/* ---------------- Add / delete -------------------------------------------- */
function addListing(cat) {
  const id = "new-" + Date.now().toString(36);
  cat.listings.unshift({
    id, title: "New " + (cat.model || "listing"), year: null, trim: null, drivetrain: null,
    mileage: null, price: null, priceConfidence: "unknown", sourceLink: "",
    dealer: "", distanceMiles: null, favorite: false, status: "", notes: "", checklist: {}
  });
  persist();
  render();
  // open the new card's edit form
  setTimeout(() => {
    const first = $(".card");
    if (first) { const ed = first.querySelectorAll("details.disc")[1]; if (ed) ed.setAttribute("open", ""); first.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }, 30);
  toast("Listing added — fill in the details");
}

function deleteListing(cat, l) {
  if (!confirm(`Delete “${l.title || "this listing"}”?`)) return;
  cat.listings = cat.listings.filter(x => x !== l);
  persist();
  render();
  toast("Deleted");
}

/* ---------------- Trim primer --------------------------------------------- */
function trimPrimerSection(cat) {
  if (!cat.trimPrimer || !cat.trimPrimer.length) return el("span");
  const body = el("div", { class: "ref-body" });
  cat.trimPrimer.forEach(t => {
    const seatsWarn = t.seats && t.seats < 8;
    const trim = el("div", { class: "trim" },
      el("div", { class: "trim-head" },
        el("span", { class: "trim-name" }, t.trim),
        el("span", { class: "trim-tier" }, t.tier || ""),
        t.budgetFit ? el("span", { class: "fitpill fit-" + slug((t.budgetFit || "").split(" ")[0]) }, (t.budgetFit || "").split(" ")[0]) : null,
        el("span", { class: "trim-seats" },
          el("span", { class: seatsWarn ? "seat-warn" : "seat-ok" }, (t.seats ?? "?") + " seats"),
          t.seatsConfig ? " · " + t.seatsConfig : "")
      ),
      el("div", { class: "trim-detail" },
        el("span", { class: "k" }, "Has: "), (t.keyFeatures || []).join(", ") || "—"),
      (t.skips && t.skips.length) ? el("div", { class: "trim-detail" },
        el("span", { class: "k" }, "Skips: "), t.skips.join(", ")) : null,
      t.warning ? el("div", { class: "warnbox" }, "⚠ " + t.warning) : null
    );
    body.appendChild(trim);
  });

  return el("section", { class: "ref" },
    el("details", { open: cat.trimPrimer.some(t => t.warning) ? "" : null },
      el("summary", {}, cat.primerLabel || "Trim primer"),
      body));
}

/* ---------------- Known issues -------------------------------------------- */
const ISSUE_LABELS = {
  engineOilConsumption: "Engine oil consumption",
  screenClusterFailure: "Screen / cluster failure",
  selfLevelingShocks: "Self-leveling shocks",
  valveSpring2024: "2024 valve spring recall",
  windowTrimMolding: "Window trim molding"
};
// camelCase key → "Title Case" fallback for categories without an explicit map.
const prettyKey = (k) => k.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase()).trim();
function knownIssuesSection(cat) {
  const issues = cat.knownIssues || {};
  const keys = Object.keys(issues);
  if (!keys.length) return el("span");
  const body = el("div", { class: "ref-body" },
    ...keys.map(k => el("div", { class: "issue" },
      el("b", {}, ISSUE_LABELS[k] || prettyKey(k)), " — ", issues[k])));
  return el("section", { class: "ref" },
    el("details", {}, el("summary", {}, "Known issues to check"), body));
}

/* ---------------- Search hubs --------------------------------------------- */
function searchHubsSection(cat) {
  const hubs = cat.searchHubs || [];
  if (!hubs.length) return el("span");
  const body = el("div", { class: "ref-body" },
    el("div", { class: "hubs" },
      ...hubs.map(h => el("a", { class: "hub", href: h.url, target: "_blank", rel: "noopener" }, h.name))));
  return el("section", { class: "ref" },
    el("details", { open: "" }, el("summary", {}, "Search hubs"), body));
}

/* ---------------- Export / import / reset --------------------------------- */
function exportState() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: `driver-car-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Exported current state");
}

function importStateFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      // Accept either a full app state (has .categories) or a single raw seed doc.
      if (parsed.categories) {
        state = parsed;
      } else if (parsed.listings) {
        const key = (parsed.meta && parsed.meta.model || "imported").toLowerCase().replace(/[^a-z0-9]+/g, "") || "imported";
        state = {
          schemaVersion: 1,
          activeCategory: key,
          lastUpdated: new Date().toISOString().slice(0, 10),
          categories: { [key]: categoryFromSeed(parsed, { label: "Imported" }) }
        };
      } else throw new Error("Unrecognized JSON shape");
      if (!state.activeCategory || !state.categories[state.activeCategory])
        state.activeCategory = Object.keys(state.categories)[0];
      persist();
      render();
      toast("Imported ✓");
    } catch (e) {
      alert("Couldn't import that file:\n" + e.message);
    }
  };
  reader.readAsText(file);
}

async function resetToSeed() {
  if (!confirm("Reset everything to the seed data? This wipes your edits in this browser.")) return;
  store.clear();
  state = await freshState();
  store.save(state);
  ui = { sort: "default", filterTrim: "all", filterDrive: "all", favOnly: false };
  render();
  toast("Reset to seed");
}

/* ---------------- Wire up footer controls --------------------------------- */
$("#exportBtn").addEventListener("click", exportState);
$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#importFile").addEventListener("change", e => { if (e.target.files[0]) importStateFromFile(e.target.files[0]); e.target.value = ""; });
$("#resetBtn").addEventListener("click", resetToSeed);

/* ---------------- Go ------------------------------------------------------ */
init();
</script>
